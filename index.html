<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Галерея</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #d0f0fd;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gallery-container,
        .footer {
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .gallery-container {
            padding: 30px;
        }

        .footer {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            color: #6c757d;
        }

        .footer p {
            margin: 0;
        }
        .slider img {
            display: block;
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 6px;
        }

        .slick-slide {
            padding: 0 10px;
            box-sizing: border-box;
            outline: none;
        }

        .slick-prev,
        .slick-next {
            z-index: 100;
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
        }

        /* slick-theme делает кнопку прозрачной при hover/focus,
           белая стрелка на белом фоне пропадала. */
        .slick-prev:hover,
        .slick-prev:focus,
        .slick-next:hover,
        .slick-next:focus {
            background: #555;
        }

        .slick-prev {
            left: -15px;
        }

        .slick-next {
            right: -15px;
        }

        .slick-prev:before,
        .slick-next:before {
            color: #fff;
            font-size: 22px;
            font-family: Arial, sans-serif;
            opacity: 1;
        }

        .slick-prev:before {
            content: "‹";
        }

        .slick-next:before {
            content: "›";
        }

        .pager {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 15px;
            }

            .slider img {
                height: 350px;
            }

            .slick-prev {
                left: -5px;
            }

            .slick-next {
                right: -5px;
            }
        }
    </style>
</head>
<body>
    <main class="gallery-container">
        <div class="slider">
            <div><img src="image1.jpg" alt="Изображение 1"></div>
            <div><img src="image2.jpg" alt="Изображение 2"></div>
            <div><img src="image3.jpg" alt="Изображение 3"></div>
            <div><img src="image4.jpg" alt="Изображение 4"></div>
            <div><img src="image5.jpg" alt="Изображение 5"></div>
            <div><img src="image6.jpg" alt="Изображение 6"></div>
            <div><img src="image7.jpg" alt="Изображение 7"></div>
            <div><img src="image8.jpg" alt="Изображение 8"></div>
        </div>
        <div class="pager">
            Страница <span id="current-page">1</span> из <span id="total-pages">6</span>
        </div>
    </main>

    <footer class="footer">
        <p>(с) Перетолчин Данил</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="image.js"></script>
</body>
</html>
