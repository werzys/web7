<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея изображений</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gallery-container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .slider {
            margin-bottom: 20px;
        }

        .slide-item {
            padding: 0 10px;
            box-sizing: border-box;
            outline: none;
        }

        .slide-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }

        .slick-prev, .slick-next {
            font-size: 0;
            line-height: 0;
            position: absolute;
            top: 50%;
            display: block;
            width: 40px;
            height: 40px;
            padding: 0;
            transform: translateY(-50%);
            cursor: pointer;
            color: transparent;
            border: none;
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            z-index: 10;
        }

        .slick-prev { left: -25px; }
        .slick-next { right: -25px; }

        .slick-prev:before, .slick-next:before {
            font-family: Arial, sans-serif;
            font-size: 18px;
            color: white;
            opacity: 1;
        }

        .slick-prev:before { content: '❮'; }
        .slick-next:before { content: '❯'; }

        .pager {
            text-align: center;
            font-size: 16px;
            color: #333;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .slick-prev { left: -10px; }
            .slick-next { right: -10px; }
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <div class="slider">
            <div class="slide-item"><img src="image1.jpg" alt="Фото 1"></div>
            <div class="slide-item"><img src="image2.jpg" alt="Фото 2"></div>
            <div class="slide-item"><img src="image3.jpg" alt="Фото 3"></div>
            <div class="slide-item"><img src="image4.jpg" alt="Фото 4"></div>
            <div class="slide-item"><img src="image5.jpg" alt="Фото 5"></div>
            <div class="slide-item"><img src="image6.jpg" alt="Фото 6"></div>
            <div class="slide-item"><img src="image7.jpg" alt="Фото 7"></div>
            <div class="slide-item"><img src="image8.jpg" alt="Фото 8"></div>
        </div>

        <div class="pager">
            Страница <span id="current-page">1</span> из <span id="total-pages">1</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
